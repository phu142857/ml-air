# MLAir default local runtime: one all-in-one app container plus optional sidecars.
# MinIO / Prometheus / Grafana use Compose profiles (minio, prometheus, grafana) and
# start only when enabled in mlair.yaml → infra (see docs/configuration.md).

name: mlair

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.allinone
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_MLAIR_REALTIME_WS: ${NEXT_PUBLIC_MLAIR_REALTIME_WS:-}
    image: ${MLAIR_IMAGE:-ml-air:latest}
    container_name: mlair
    ports:
      - "${MLAIR_PORT:-8080}:8080"
    environment:
      MLAIR_PROFILE: ${MLAIR_PROFILE:-development}
      ML_AIR_ENVIRONMENT: ${ML_AIR_ENVIRONMENT:-development}
      ML_AIR_TRACKING_TOKEN: ${ML_AIR_TRACKING_TOKEN:-}
      ML_AIR_JWT_HS256_SECRET: ${ML_AIR_JWT_HS256_SECRET:-mlair-dev-jwt-secret-32bytes-minimum-key}
      ML_AIR_IDENTITY_JWT_SECRET: ${ML_AIR_IDENTITY_JWT_SECRET:-mlair-dev-identity-jwt-secret-32bytes-minimum}
      ML_AIR_BOOTSTRAP_ADMIN_USERNAME: ${ML_AIR_BOOTSTRAP_ADMIN_USERNAME:-admin}
      ML_AIR_BOOTSTRAP_ADMIN_PASSWORD: ${ML_AIR_BOOTSTRAP_ADMIN_PASSWORD:-admin-change-me}
      ML_AIR_LEGACY_STATIC_TOKENS: ${ML_AIR_LEGACY_STATIC_TOKENS:-0}
      ML_AIR_SA_SCHEDULER_SECRET: ${ML_AIR_SA_SCHEDULER_SECRET:-mlair-dev-sa-scheduler-secret-change-me}
      ML_AIR_SA_EXECUTOR_SECRET: ${ML_AIR_SA_EXECUTOR_SECRET:-mlair-dev-sa-executor-secret-change-me}
      ML_AIR_AUTH_TOKENS_JSON: ${ML_AIR_AUTH_TOKENS_JSON:-}
      ML_AIR_JWT_ISSUER: ${ML_AIR_JWT_ISSUER:-}
      ML_AIR_JWT_AUDIENCE: ${ML_AIR_JWT_AUDIENCE:-}
      ML_AIR_JWT_JWKS_URL: ${ML_AIR_JWT_JWKS_URL:-}
      ML_AIR_JWT_JWKS_CACHE_TTL_SECONDS: ${ML_AIR_JWT_JWKS_CACHE_TTL_SECONDS:-300}
      ML_AIR_MANIFEST_SIGNING_KEY: ${ML_AIR_MANIFEST_SIGNING_KEY:-mlair-dev-manifest-signing-key}
      ML_AIR_MANIFEST_ACTIVE_KEY_ID: ${ML_AIR_MANIFEST_ACTIVE_KEY_ID:-v1}
      ML_AIR_MANIFEST_SIGNING_KEYS_JSON: ${ML_AIR_MANIFEST_SIGNING_KEYS_JSON:-}
      ML_AIR_MANIFEST_KEY_PROVIDER: ${ML_AIR_MANIFEST_KEY_PROVIDER:-env}
      ML_AIR_MANIFEST_MANAGED_KEYS_FILE: ${ML_AIR_MANIFEST_MANAGED_KEYS_FILE:-}
      ML_AIR_MANIFEST_STRICT_KEY_LIFECYCLE: ${ML_AIR_MANIFEST_STRICT_KEY_LIFECYCLE:-1}
      ML_AIR_MANIFEST_ALLOWED_KEY_IDS: ${ML_AIR_MANIFEST_ALLOWED_KEY_IDS:-}
      ML_AIR_MANIFEST_SIGNING_ALGORITHM: ${ML_AIR_MANIFEST_SIGNING_ALGORITHM:-hmac-sha256}
      ML_AIR_MANIFEST_ED25519_PRIVATE_KEY: ${ML_AIR_MANIFEST_ED25519_PRIVATE_KEY:-}
      ML_AIR_MANIFEST_ED25519_PRIVATE_KEYS_JSON: ${ML_AIR_MANIFEST_ED25519_PRIVATE_KEYS_JSON:-}
      ML_AIR_MANIFEST_ED25519_PUBLIC_KEY: ${ML_AIR_MANIFEST_ED25519_PUBLIC_KEY:-}
      ML_AIR_MANIFEST_ED25519_PUBLIC_KEYS_JSON: ${ML_AIR_MANIFEST_ED25519_PUBLIC_KEYS_JSON:-}
      ML_AIR_TASK_EXECUTION_MODE: ${ML_AIR_TASK_EXECUTION_MODE:-external}
      ML_AIR_DEFAULT_MODEL_ARTIFACT_ROOT: ${ML_AIR_DEFAULT_MODEL_ARTIFACT_ROOT:-file:///mlair/artifacts/models}
      ML_AIR_DATASET_ARTIFACT_ROOT: ${ML_AIR_DATASET_ARTIFACT_ROOT:-file:///mlair/artifacts/datasets}
      ML_AIR_RUNTIME_REALTIME_BASE_URL: ${ML_AIR_RUNTIME_REALTIME_BASE_URL:-}
      ML_AIR_RUNTIME_REALTIME_DEFAULT_URL: ${ML_AIR_RUNTIME_REALTIME_DEFAULT_URL:-}
      # Fixed in-container ports (not host-published). Do not use ${VAR:-default} here —
      # podman-compose may pass the literal string and crash scheduler/realtime.
      ML_AIR_REALTIME_METRICS_PORT: "9104"
      ML_AIR_SCHEDULER_METRICS_PORT: "9102"
      ML_AIR_EXECUTOR_METRICS_PORT: "9103"
    volumes:
      - mlair_pgdata:/var/lib/postgresql/data
      - mlair_dataset_artifacts:/mlair/artifacts/datasets
      - mlair_model_artifacts:/mlair/artifacts/models
    expose:
      - "9102"
      - "9103"
      - "9104"
    restart: unless-stopped

  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    container_name: ml-air-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
    ports:
      - "${ML_AIR_MINIO_API_PORT:-9000}:9000"
      - "${ML_AIR_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ml_air_minio:/data
    restart: unless-stopped

  prometheus:
    profiles: ["prometheus"]
    image: prom/prometheus:v2.54.1
    container_name: ml-air-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
    ports:
      - "${ML_AIR_PROMETHEUS_PORT:-39090}:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    profiles: ["grafana"]
    image: grafana/grafana:11.2.0
    container_name: ml-air-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "${GF_USERS_ALLOW_SIGN_UP:-false}"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${ML_AIR_GRAFANA_PORT:-33000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mlair_pgdata:
  mlair_dataset_artifacts:
  mlair_model_artifacts:
  ml_air_minio:
