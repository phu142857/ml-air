# MLAir single-container runtime (default for `mlair serve`).
# One service, one public port: Hub + API (/v1) + realtime (/ws) via internal nginx.

name: mlair

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.allinone
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_MLAIR_REALTIME_WS: ${NEXT_PUBLIC_MLAIR_REALTIME_WS:-}
    image: ${MLAIR_IMAGE:-ml-air:latest}
    container_name: mlair
    ports:
      - "${MLAIR_PORT:-8080}:8080"
    environment:
      ML_AIR_TRACKING_TOKEN: ${ML_AIR_TRACKING_TOKEN:-admin-token}
      ML_AIR_JWT_HS256_SECRET: ${ML_AIR_JWT_HS256_SECRET:-mlair-dev-jwt-secret-32bytes-minimum-key}
      ML_AIR_SKIP_APPROVAL_FOR_PROMOTE: ${ML_AIR_SKIP_APPROVAL_FOR_PROMOTE:-1}
      ML_AIR_READINESS_ALLOW_LEGACY_FALLBACK: ${ML_AIR_READINESS_ALLOW_LEGACY_FALLBACK:-1}
      ML_AIR_STRICT_DATASET_VERSION_REQUIRED: ${ML_AIR_STRICT_DATASET_VERSION_REQUIRED:-0}
      ML_AIR_STRICT_DATASET_VERSION_ALL_POST_RUNS: ${ML_AIR_STRICT_DATASET_VERSION_ALL_POST_RUNS:-0}
      ML_AIR_USAGE_TRACKING_ENABLED: ${ML_AIR_USAGE_TRACKING_ENABLED:-1}
      ML_AIR_RESOURCE_MONITOR_ENABLED: ${ML_AIR_RESOURCE_MONITOR_ENABLED:-1}
      ML_AIR_RESOURCE_SAMPLE_INTERVAL: ${ML_AIR_RESOURCE_SAMPLE_INTERVAL:-1}
      ML_AIR_RESOURCE_FLUSH_INTERVAL: ${ML_AIR_RESOURCE_FLUSH_INTERVAL:-1}
      ML_AIR_TASK_EXECUTION_MODE: ${ML_AIR_TASK_EXECUTION_MODE:-external}
      ML_AIR_TASK_LEASE_SECONDS: ${ML_AIR_TASK_LEASE_SECONDS:-300}
      ML_AIR_ENVIRONMENT: ${ML_AIR_ENVIRONMENT:-development}
      ML_AIR_GRAFANA_URL: ${ML_AIR_GRAFANA_URL:-}
    volumes:
      - mlair_pgdata:/var/lib/postgresql/data
      - mlair_dataset_artifacts:/mlair/artifacts/datasets
      - mlair_model_artifacts:/mlair/artifacts/models
    restart: unless-stopped

  mlair-artifact-init:
    image: docker.io/library/alpine:3.20
    user: "0:0"
    volumes:
      - mlair_dataset_artifacts:/datasets
      - mlair_model_artifacts:/models
      - cv_workload_artifacts:/cv-artifacts
    command:
      - sh
      - -c
      - |
        mkdir -p /datasets /models /cv-artifacts/jobs /cv-artifacts/uploads /cv-artifacts/mlair_pipeline_runs
        mkdir -p /datasets/cv-runtime-frames
        chown -R 1000:1000 /datasets /models /cv-artifacts
    restart: "no"

  cv-api:
    build:
      context: ${MLAIR_YOLO_ROOT:-../../YOLOv8-DeepSORT-Streamlit}
      dockerfile: Dockerfile
      args:
        PYTORCH_WHEEL: ${PYTORCH_WHEEL:-cpu}
    image: ${CV_IMAGE:-cv-lifecycle-workload:latest}
    container_name: cv-lifecycle-api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      PYTHONPATH: /app
      CV_ARTIFACT_ROOT: /app/artifacts
      CV_API_BASE_URL: http://cv-api:8000
      CV_MLAIR_API_URL: http://api:8080
      CV_MLAIR_HUB_URL: http://localhost:${MLAIR_PORT:-8080}
      CV_MLAIR_TOKEN: ${CV_MLAIR_TOKEN:-admin-token}
      CV_MLAIR_TENANT: ${CV_MLAIR_TENANT:-default}
      CV_MLAIR_PROJECT: ${CV_MLAIR_PROJECT:-default_project}
      CV_MLAIR_DATASET_NAME: ${CV_MLAIR_DATASET_NAME:-cv-traffic-frames}
      CV_MLAIR_PIPELINE_REQUIRED_SIZE: ${CV_MLAIR_PIPELINE_REQUIRED_SIZE:-50}
      CV_MLAIR_AUTO_INGEST: ${CV_MLAIR_AUTO_INGEST:-1}
      CV_MLAIR_AUTO_MATERIALIZE: ${CV_MLAIR_AUTO_MATERIALIZE:-0}
      CV_MLAIR_MODEL_ID: ${CV_MLAIR_MODEL_ID:-}
      CV_MLAIR_AUTO_TRAIN: ${CV_MLAIR_AUTO_TRAIN:-0}
      CV_MLAIR_TRAIN_PIPELINE_ID: ${CV_MLAIR_TRAIN_PIPELINE_ID:-cv-yolo-lifecycle-train}
      CV_MLAIR_PIPELINE_MODE: ${CV_MLAIR_PIPELINE_MODE:-plugin}
      CV_MLAIR_LIFECYCLE_IMPORT_STAGE: ${CV_MLAIR_LIFECYCLE_IMPORT_STAGE:-staging}
      CV_MLAIR_LIFECYCLE_AUTO_PROMOTE: ${CV_MLAIR_LIFECYCLE_AUTO_PROMOTE:-1}
      CV_MLAIR_GATE_MIN_MAP_DELTA: ${CV_MLAIR_GATE_MIN_MAP_DELTA:-0.0}
      CV_MLAIR_BOOTSTRAP_PIPELINE: ${CV_MLAIR_BOOTSTRAP_PIPELINE:-1}
      CV_MLAIR_TRAIN_CALLBACK_TOKEN: ${CV_MLAIR_TRAIN_CALLBACK_TOKEN:-admin-token}
      CV_MLAIR_PROMOTE_WEBHOOK_TOKEN: ${CV_MLAIR_PROMOTE_WEBHOOK_TOKEN:-admin-token}
      CV_MLAIR_SYNC_ON_HUB_PROMOTE: ${CV_MLAIR_SYNC_ON_HUB_PROMOTE:-1}
      CV_MLAIR_TRAIN_EPOCHS: ${CV_MLAIR_TRAIN_EPOCHS:-10}
      CV_MLAIR_AUTO_PROMOTE: ${CV_MLAIR_AUTO_PROMOTE:-0}
      CV_MLAIR_AUTO_SYNC_MODELS: ${CV_MLAIR_AUTO_SYNC_MODELS:-1}
      CV_MLAIR_SYNC_ON_STARTUP: ${CV_MLAIR_SYNC_ON_STARTUP:-1}
      CV_MLAIR_SYNC_AFTER_TRAIN: ${CV_MLAIR_SYNC_AFTER_TRAIN:-1}
      CV_MLAIR_SYNC_INTERVAL_SEC: ${CV_MLAIR_SYNC_INTERVAL_SEC:-300}
      CV_MLAIR_REGISTRY_RESYNC_SECONDS: ${CV_MLAIR_REGISTRY_RESYNC_SECONDS:-120}
      CV_MLAIR_REGISTRY_SYNC_AT_STARTUP: ${CV_MLAIR_REGISTRY_SYNC_AT_STARTUP:-1}
      CV_MLAIR_DISK_SYNC_MODE: ${CV_MLAIR_DISK_SYNC_MODE:-metadata}
      CV_MLAIR_DISK_IMPORT_ALL_VERSIONS: ${CV_MLAIR_DISK_IMPORT_ALL_VERSIONS:-0}
      CV_MLAIR_MIRROR_REGISTRY_TO_LOCAL: ${CV_MLAIR_MIRROR_REGISTRY_TO_LOCAL:-1}
      CV_MLAIR_MODEL_ARTIFACT_MOUNT: /mlair/artifacts
      CV_MLAIR_PERSIST_INGEST_FRAMES: ${CV_MLAIR_PERSIST_INGEST_FRAMES:-0}
      CV_PERSIST_JOBS: ${CV_PERSIST_JOBS:-1}
    volumes:
      - cv_workload_artifacts:/app/artifacts
      - ${MLAIR_YOLO_ROOT:-../../YOLOv8-DeepSORT-Streamlit}/weights:/app/weights
      - mlair_model_artifacts:/mlair/artifacts/models:ro
      - mlair_dataset_artifacts:/mlair/artifacts/datasets
    ports:
      - "${CV_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 180s
    depends_on:
      mlair-artifact-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

  mlair-cv-train-worker:
    image: ${CV_WORKER_IMAGE:-cv-lifecycle-workload:latest}
    container_name: mlair-cv-train-worker
    command: python scripts/mlair_cv_pipeline_worker.py
    environment:
      PYTHONPATH: /app
      MLAIR_API_BASE_URL: http://api:8080
      MLAIR_WORKER_TOKEN: ${ML_AIR_TRACKING_TOKEN:-admin-token}
      MLAIR_WORKER_ID: ${MLAIR_CV_TRAIN_WORKER_ID:-}
      MLAIR_CAPABILITIES: cv_yolo_split,cv_yolo_detect,cv_yolo_prepare,cv_yolo_train,cv_yolo_eval,cv_yolo_gate,cv_hard_example_mine
      CV_MLAIR_LIFECYCLE_IMPORT_STAGE: ${CV_MLAIR_LIFECYCLE_IMPORT_STAGE:-staging}
      CV_MLAIR_LIFECYCLE_AUTO_PROMOTE: ${CV_MLAIR_LIFECYCLE_AUTO_PROMOTE:-1}
      CV_MLAIR_GATE_MIN_MAP_DELTA: ${CV_MLAIR_GATE_MIN_MAP_DELTA:-0.0}
      CV_MLAIR_HARD_EXAMPLE_DATASET: ${CV_MLAIR_HARD_EXAMPLE_DATASET:-cv-traffic-hard-examples}
      CV_MLAIR_HARD_EXAMPLE_MAX_CONF: ${CV_MLAIR_HARD_EXAMPLE_MAX_CONF:-0.35}
      CV_MLAIR_PERSIST_INGEST_FRAMES: ${CV_MLAIR_PERSIST_INGEST_FRAMES:-0}
      MLAIR_HEARTBEAT_INTERVAL_SEC: ${MLAIR_HEARTBEAT_INTERVAL_SEC:-1}
      MLAIR_RESOURCE_MONITOR_ENABLED: ${MLAIR_RESOURCE_MONITOR_ENABLED:-1}
      MLAIR_RESOURCE_SAMPLE_INTERVAL_SEC: ${MLAIR_RESOURCE_SAMPLE_INTERVAL_SEC:-1}
      CV_MLAIR_TRAIN_DEVICE: ${CV_MLAIR_TRAIN_DEVICE:-cpu}
      CV_MLAIR_TRAIN_EPOCHS: ${CV_MLAIR_TRAIN_EPOCHS:-10}
      CV_MLAIR_TRAIN_MAX_FRAMES: ${CV_MLAIR_TRAIN_MAX_FRAMES:-0}
      CV_MLAIR_DETECT_MAX_FRAMES: ${CV_MLAIR_DETECT_MAX_FRAMES:-0}
      CV_MLAIR_TRAIN_BATCH: ${CV_MLAIR_TRAIN_BATCH:-1}
      CV_MLAIR_TRAIN_IMGSZ: ${CV_MLAIR_TRAIN_IMGSZ:-512}
      CV_MLAIR_TRAIN_WORKERS: ${CV_MLAIR_TRAIN_WORKERS:-0}
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      CV_ARTIFACT_ROOT: /app/artifacts
      CV_API_BASE_URL: http://cv-api:8000
      CV_MLAIR_API_URL: http://api:8080
      CV_MLAIR_TOKEN: ${CV_MLAIR_TOKEN:-admin-token}
      CV_MLAIR_TENANT: ${CV_MLAIR_TENANT:-default}
      CV_MLAIR_PROJECT: ${CV_MLAIR_PROJECT:-default_project}
      CV_MLAIR_MODEL_ARTIFACT_MOUNT: /mlair/artifacts
    volumes:
      - cv_workload_artifacts:/app/artifacts
      - ${MLAIR_YOLO_ROOT:-../../YOLOv8-DeepSORT-Streamlit}/weights:/app/weights
      - mlair_model_artifacts:/mlair/artifacts/models:ro
      - mlair_dataset_artifacts:/mlair/artifacts/datasets
    depends_on:
      mlair-artifact-init:
        condition: service_completed_successfully
      cv-api:
        condition: service_healthy
    restart: unless-stopped

  cv-ui:
    image: ${CV_IMAGE:-cv-lifecycle-workload:latest}
    container_name: cv-lifecycle-ui
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0 --browser.gatherUsageStats=false
    environment:
      PYTHONPATH: /app
      CV_API_BASE_URL: http://cv-api:8000
      CV_MLAIR_HUB_URL: http://localhost:${MLAIR_PORT:-8080}
      CV_CLIENT_SAVE_TO_DATASET: ${CV_CLIENT_SAVE_TO_DATASET:-1}
    volumes:
      - ${MLAIR_YOLO_ROOT:-../../YOLOv8-DeepSORT-Streamlit}/weights:/app/weights:ro
    ports:
      - "${CV_UI_PORT:-8501}:8501"
    depends_on:
      cv-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mlair_pgdata:
  mlair_dataset_artifacts:
  mlair_model_artifacts:
  cv_workload_artifacts:
