# MLAir default local runtime: one all-in-one app container plus supporting
# observability/storage services. The app still exposes one public entrypoint
# (:8080) for Hub + API (/v1) + realtime (/ws) via internal nginx.

name: mlair

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.allinone
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_MLAIR_REALTIME_WS: ${NEXT_PUBLIC_MLAIR_REALTIME_WS:-}
    image: ${MLAIR_IMAGE:-ml-air:latest}
    container_name: mlair
    ports:
      - "${MLAIR_PORT:-8080}:8080"
    environment:
      ML_AIR_TRACKING_TOKEN: ${ML_AIR_TRACKING_TOKEN:-admin-token}
      ML_AIR_JWT_HS256_SECRET: ${ML_AIR_JWT_HS256_SECRET:-mlair-dev-jwt-secret-32bytes-minimum-key}
      ML_AIR_AUTH_TOKENS_JSON: ${ML_AIR_AUTH_TOKENS_JSON:-}
      ML_AIR_JWT_ISSUER: ${ML_AIR_JWT_ISSUER:-}
      ML_AIR_JWT_AUDIENCE: ${ML_AIR_JWT_AUDIENCE:-}
      ML_AIR_JWT_JWKS_URL: ${ML_AIR_JWT_JWKS_URL:-}
      ML_AIR_JWT_JWKS_CACHE_TTL_SECONDS: ${ML_AIR_JWT_JWKS_CACHE_TTL_SECONDS:-300}
      ML_AIR_SKIP_APPROVAL_FOR_PROMOTE: ${ML_AIR_SKIP_APPROVAL_FOR_PROMOTE:-1}
      ML_AIR_READINESS_ALLOW_LEGACY_FALLBACK: ${ML_AIR_READINESS_ALLOW_LEGACY_FALLBACK:-1}
      ML_AIR_REQUIRE_DECLARED_DATASET_INPUTS: ${ML_AIR_REQUIRE_DECLARED_DATASET_INPUTS:-1}
      ML_AIR_STRICT_DATASET_VERSION_REQUIRED: ${ML_AIR_STRICT_DATASET_VERSION_REQUIRED:-1}
      ML_AIR_STRICT_DATASET_VERSION_ALL_POST_RUNS: ${ML_AIR_STRICT_DATASET_VERSION_ALL_POST_RUNS:-1}
      ML_AIR_EVENT_OUTBOX: ${ML_AIR_EVENT_OUTBOX:-1}
      ML_AIR_EVENT_OUTBOX_DRAIN_INTERVAL_SEC: ${ML_AIR_EVENT_OUTBOX_DRAIN_INTERVAL_SEC:-5}
      ML_AIR_EVENT_STREAM: ${ML_AIR_EVENT_STREAM:-1}
      ML_AIR_EVENT_STREAM_GLOBAL_FANOUT: ${ML_AIR_EVENT_STREAM_GLOBAL_FANOUT:-1}
      ML_AIR_EVENT_STREAM_MAXLEN: ${ML_AIR_EVENT_STREAM_MAXLEN:-50000}
      ML_AIR_EVENT_STREAM_GLOBAL_MAXLEN: ${ML_AIR_EVENT_STREAM_GLOBAL_MAXLEN:-200000}
      ML_AIR_EXECUTION_PROJECTION: ${ML_AIR_EXECUTION_PROJECTION:-1}
      ML_AIR_SEMANTIC_EVENT_SIGNING: ${ML_AIR_SEMANTIC_EVENT_SIGNING:-1}
      ML_AIR_SEMANTIC_EVENT_VALIDATE: ${ML_AIR_SEMANTIC_EVENT_VALIDATE:-1}
      ML_AIR_SEMANTIC_WEBHOOK_DELIVERY: ${ML_AIR_SEMANTIC_WEBHOOK_DELIVERY:-1}
      ML_AIR_SEMANTIC_WEBHOOK_DEDUPE: ${ML_AIR_SEMANTIC_WEBHOOK_DEDUPE:-1}
      ML_AIR_SEMANTIC_WEBHOOK_TIMEOUT_SECONDS: ${ML_AIR_SEMANTIC_WEBHOOK_TIMEOUT_SECONDS:-10}
      ML_AIR_SEMANTIC_WEBHOOK_MAX_ATTEMPTS: ${ML_AIR_SEMANTIC_WEBHOOK_MAX_ATTEMPTS:-3}
      ML_AIR_SEMANTIC_WEBHOOK_RETRY_BACKOFF_MS: ${ML_AIR_SEMANTIC_WEBHOOK_RETRY_BACKOFF_MS:-250}
      ML_AIR_WEBHOOK_ALLOWED_HOSTS: ${ML_AIR_WEBHOOK_ALLOWED_HOSTS:-}
      ML_AIR_USAGE_TRACKING_ENABLED: ${ML_AIR_USAGE_TRACKING_ENABLED:-1}
      ML_AIR_RESOURCE_MONITOR_ENABLED: ${ML_AIR_RESOURCE_MONITOR_ENABLED:-1}
      ML_AIR_RESOURCE_SAMPLE_INTERVAL: ${ML_AIR_RESOURCE_SAMPLE_INTERVAL:-1}
      ML_AIR_RESOURCE_FLUSH_INTERVAL: ${ML_AIR_RESOURCE_FLUSH_INTERVAL:-1}
      ML_AIR_ENABLE_SERVING_SLOTS_HTTP: ${ML_AIR_ENABLE_SERVING_SLOTS_HTTP:-1}
      ML_AIR_FEATURE_DATASET_HUB_V2: ${ML_AIR_FEATURE_DATASET_HUB_V2:-1}
      ML_AIR_FEATURE_SCOPE_DEBUG_PANEL: ${ML_AIR_FEATURE_SCOPE_DEBUG_PANEL:-1}
      ML_AIR_READINESS_ASYNC_QUEUE: ${ML_AIR_READINESS_ASYNC_QUEUE:-1}
      ML_AIR_READINESS_QUEUE_DRAIN_INTERVAL_SEC: ${ML_AIR_READINESS_QUEUE_DRAIN_INTERVAL_SEC:-2}
      ML_AIR_VALIDATE_DATASET_VERSION_CHECKSUM: ${ML_AIR_VALIDATE_DATASET_VERSION_CHECKSUM:-1}
      ML_AIR_VALIDATE_PLUGIN_EXISTS_ON_CREATE: ${ML_AIR_VALIDATE_PLUGIN_EXISTS_ON_CREATE:-1}
      ML_AIR_DATASET_RETENTION_POLICIES: ${ML_AIR_DATASET_RETENTION_POLICIES:-1}
      ML_AIR_DATASET_RETENTION_ALLOW_APPLY: ${ML_AIR_DATASET_RETENTION_ALLOW_APPLY:-1}
      ML_AIR_DATASET_RETENTION_DEFAULT_MAX_VERSIONS: ${ML_AIR_DATASET_RETENTION_DEFAULT_MAX_VERSIONS:-50}
      ML_AIR_HTTP_PIPELINE_TASKS: ${ML_AIR_HTTP_PIPELINE_TASKS:-1}
      ML_AIR_HTTP_TASK_TEMPLATES: ${ML_AIR_HTTP_TASK_TEMPLATES:-1}
      MLAIR_PLUGIN_VERSION_ENFORCE: ${MLAIR_PLUGIN_VERSION_ENFORCE:-1}
      ML_AIR_MANIFEST_SIGNING_KEY: ${ML_AIR_MANIFEST_SIGNING_KEY:-mlair-dev-manifest-signing-key}
      ML_AIR_MANIFEST_ACTIVE_KEY_ID: ${ML_AIR_MANIFEST_ACTIVE_KEY_ID:-v1}
      ML_AIR_MANIFEST_SIGNING_KEYS_JSON: ${ML_AIR_MANIFEST_SIGNING_KEYS_JSON:-}
      ML_AIR_MANIFEST_KEY_PROVIDER: ${ML_AIR_MANIFEST_KEY_PROVIDER:-env}
      ML_AIR_MANIFEST_MANAGED_KEYS_FILE: ${ML_AIR_MANIFEST_MANAGED_KEYS_FILE:-}
      ML_AIR_MANIFEST_STRICT_KEY_LIFECYCLE: ${ML_AIR_MANIFEST_STRICT_KEY_LIFECYCLE:-1}
      ML_AIR_MANIFEST_ALLOWED_KEY_IDS: ${ML_AIR_MANIFEST_ALLOWED_KEY_IDS:-}
      ML_AIR_MANIFEST_SIGNING_ALGORITHM: ${ML_AIR_MANIFEST_SIGNING_ALGORITHM:-hmac-sha256}
      ML_AIR_MANIFEST_ED25519_PRIVATE_KEY: ${ML_AIR_MANIFEST_ED25519_PRIVATE_KEY:-}
      ML_AIR_MANIFEST_ED25519_PRIVATE_KEYS_JSON: ${ML_AIR_MANIFEST_ED25519_PRIVATE_KEYS_JSON:-}
      ML_AIR_MANIFEST_ED25519_PUBLIC_KEY: ${ML_AIR_MANIFEST_ED25519_PUBLIC_KEY:-}
      ML_AIR_MANIFEST_ED25519_PUBLIC_KEYS_JSON: ${ML_AIR_MANIFEST_ED25519_PUBLIC_KEYS_JSON:-}
      ML_AIR_TASK_EXECUTION_MODE: ${ML_AIR_TASK_EXECUTION_MODE:-external}
      ML_AIR_TASK_LEASE_SECONDS: ${ML_AIR_TASK_LEASE_SECONDS:-300}
      ML_AIR_LEASE_REAP_INTERVAL_SECONDS: ${ML_AIR_LEASE_REAP_INTERVAL_SECONDS:-5}
      ML_AIR_TRIGGER_POLICY_TICK_SECONDS: ${ML_AIR_TRIGGER_POLICY_TICK_SECONDS:-30}
      ML_AIR_DATASET_MATERIALIZATION_TICK_SECONDS: ${ML_AIR_DATASET_MATERIALIZATION_TICK_SECONDS:-30}
      ML_AIR_DATASET_MATERIALIZATION_TICK_LIMIT: ${ML_AIR_DATASET_MATERIALIZATION_TICK_LIMIT:-50}
      ML_AIR_PLUGIN_TIMEOUT_SECONDS: ${ML_AIR_PLUGIN_TIMEOUT_SECONDS:-120}
      ML_AIR_PLUGIN_RUNNER_MODULE: ${ML_AIR_PLUGIN_RUNNER_MODULE:-mlair_runner}
      ML_AIR_DEFAULT_MODEL_ARTIFACT_ROOT: ${ML_AIR_DEFAULT_MODEL_ARTIFACT_ROOT:-file:///mlair/artifacts/models}
      ML_AIR_DATASET_ARTIFACT_ROOT: ${ML_AIR_DATASET_ARTIFACT_ROOT:-file:///mlair/artifacts/datasets}
      ML_AIR_ENVIRONMENT: ${ML_AIR_ENVIRONMENT:-development}
      ML_AIR_OTEL_ENABLED: ${ML_AIR_OTEL_ENABLED:-1}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-jaeger:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      ML_AIR_JAEGER_UI_URL: ${ML_AIR_JAEGER_UI_URL:-http://localhost:16686}
      ML_AIR_GRAFANA_URL: ${ML_AIR_GRAFANA_URL:-http://localhost:33000}
      ML_AIR_RUNTIME_REALTIME_BASE_URL: ${ML_AIR_RUNTIME_REALTIME_BASE_URL:-ws://localhost:8080/ws}
      ML_AIR_RUNTIME_REALTIME_DEFAULT_URL: ${ML_AIR_RUNTIME_REALTIME_DEFAULT_URL:-ws://localhost:8080/ws}
      ML_AIR_REALTIME_METRICS_PORT: ${ML_AIR_REALTIME_METRICS_PORT:-9104}
      ML_AIR_SCHEDULER_METRICS_PORT: ${ML_AIR_SCHEDULER_METRICS_PORT:-9102}
      ML_AIR_EXECUTOR_METRICS_PORT: ${ML_AIR_EXECUTOR_METRICS_PORT:-9103}
      MLAIR_REALTIME_STREAM_FANOUT: ${MLAIR_REALTIME_STREAM_FANOUT:-1}
      MLAIR_REALTIME_STREAM_START_ID: ${MLAIR_REALTIME_STREAM_START_ID:-$}
      MLAIR_REALTIME_PING_SECONDS: ${MLAIR_REALTIME_PING_SECONDS:-30}
      MLAIR_REALTIME_MAX_PENDING_SENDS: ${MLAIR_REALTIME_MAX_PENDING_SENDS:-64}
      MLAIR_REALTIME_COALESCE_MS: ${MLAIR_REALTIME_COALESCE_MS:-150}
      MLAIR_REALTIME_STREAM_BLOCK_MS: ${MLAIR_REALTIME_STREAM_BLOCK_MS:-1000}
    volumes:
      - mlair_pgdata:/var/lib/postgresql/data
      - mlair_dataset_artifacts:/mlair/artifacts/datasets
      - mlair_model_artifacts:/mlair/artifacts/models
    expose:
      - "9102"
      - "9103"
      - "9104"
    depends_on:
      jaeger:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: ml-air-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${ML_AIR_JAEGER_UI_PORT:-16686}:16686"
      - "${ML_AIR_JAEGER_OTLP_GRPC_PORT:-4317}:4317"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ml-air-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
    ports:
      - "${ML_AIR_MINIO_API_PORT:-9000}:9000"
      - "${ML_AIR_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ml_air_minio:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ml-air-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
    ports:
      - "${ML_AIR_PROMETHEUS_PORT:-39090}:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ml-air-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "${GF_USERS_ALLOW_SIGN_UP:-false}"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${ML_AIR_GRAFANA_PORT:-33000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mlair_pgdata:
  mlair_dataset_artifacts:
  mlair_model_artifacts:
  ml_air_minio:
