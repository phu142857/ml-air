services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_MLAIR_REALTIME_WS: ${NEXT_PUBLIC_MLAIR_REALTIME_WS:-ws://localhost:8001}
        MLAIR_NEXT_INTERNAL_API_URL: ${MLAIR_NEXT_INTERNAL_API_URL:-http://api:8080}
    container_name: ml-air-frontend
    environment:
      MLAIR_NEXT_INTERNAL_API_URL: ${MLAIR_NEXT_INTERNAL_API_URL:-http://api:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ML_AIR_FRONTEND_PORT:-38080}:3000"
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${ML_AIR_PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: ml-air-api
    environment:
      ML_AIR_REDIS_URL: ${ML_AIR_REDIS_URL:-redis://redis:6379/0}
      ML_AIR_DATABASE_URL: ${ML_AIR_DATABASE_URL:-postgresql://mlair:mlair@postgres:5432/mlair}
      ML_AIR_JWT_HS256_SECRET: ${ML_AIR_JWT_HS256_SECRET:-mlair-dev-jwt-secret-32bytes-minimum-key}
      ML_AIR_TRACKING_TOKEN: ${ML_AIR_TRACKING_TOKEN:-admin-token}
      MLAIR_MODEL_PROMOTE_WEBHOOK_URL: ${MLAIR_MODEL_PROMOTE_WEBHOOK_URL:-}
      MLAIR_MODEL_PROMOTE_WEBHOOK_BEARER_TOKEN: ${MLAIR_MODEL_PROMOTE_WEBHOOK_BEARER_TOKEN:-}
      MLAIR_MODEL_PROMOTE_WEBHOOK_TIMEOUT_SECONDS: ${MLAIR_MODEL_PROMOTE_WEBHOOK_TIMEOUT_SECONDS:-15}
      # Dev quickstart: skip approval gate on promote→production (set 0 to enforce governance in local stack).
      ML_AIR_SKIP_APPROVAL_FOR_PROMOTE: ${ML_AIR_SKIP_APPROVAL_FOR_PROMOTE:-1}
      ML_AIR_MANIFEST_SIGNING_KEY: ${ML_AIR_MANIFEST_SIGNING_KEY:-mlair-dev-manifest-signing-key}
      ML_AIR_MANIFEST_ACTIVE_KEY_ID: ${ML_AIR_MANIFEST_ACTIVE_KEY_ID:-v1}
      ML_AIR_MANIFEST_SIGNING_KEYS_JSON: ${ML_AIR_MANIFEST_SIGNING_KEYS_JSON:-}
      ML_AIR_MANIFEST_KEY_PROVIDER: ${ML_AIR_MANIFEST_KEY_PROVIDER:-env}
      ML_AIR_MANIFEST_MANAGED_KEYS_FILE: ${ML_AIR_MANIFEST_MANAGED_KEYS_FILE:-}
      ML_AIR_MANIFEST_STRICT_KEY_LIFECYCLE: ${ML_AIR_MANIFEST_STRICT_KEY_LIFECYCLE:-0}
      ML_AIR_MANIFEST_ALLOWED_KEY_IDS: ${ML_AIR_MANIFEST_ALLOWED_KEY_IDS:-}
      ML_AIR_MANIFEST_SIGNING_ALGORITHM: ${ML_AIR_MANIFEST_SIGNING_ALGORITHM:-hmac-sha256}
      ML_AIR_MANIFEST_ED25519_PRIVATE_KEY: ${ML_AIR_MANIFEST_ED25519_PRIVATE_KEY:-}
      ML_AIR_MANIFEST_ED25519_PRIVATE_KEYS_JSON: ${ML_AIR_MANIFEST_ED25519_PRIVATE_KEYS_JSON:-}
      ML_AIR_MANIFEST_ED25519_PUBLIC_KEY: ${ML_AIR_MANIFEST_ED25519_PUBLIC_KEY:-}
      ML_AIR_MANIFEST_ED25519_PUBLIC_KEYS_JSON: ${ML_AIR_MANIFEST_ED25519_PUBLIC_KEYS_JSON:-}
      ML_AIR_TASK_EXECUTION_MODE: ${ML_AIR_TASK_EXECUTION_MODE:-internal}
      ML_AIR_WORKER_TOKEN: ${ML_AIR_WORKER_TOKEN:-}
      ML_AIR_TASK_LEASE_SECONDS: ${ML_AIR_TASK_LEASE_SECONDS:-30}
      ML_AIR_DATASET_ARTIFACT_ROOT: ${ML_AIR_DATASET_ARTIFACT_ROOT:-file:///mlair/artifacts/datasets}
      ML_AIR_ENABLE_SERVING_SLOTS_HTTP: ${ML_AIR_ENABLE_SERVING_SLOTS_HTTP:-0}
      MLAIR_REALTIME_ENABLED: ${MLAIR_REALTIME_ENABLED:-true}
      ML_AIR_READINESS_ALLOW_LEGACY_FALLBACK: ${ML_AIR_READINESS_ALLOW_LEGACY_FALLBACK:-0}
      ML_AIR_REQUIRE_DECLARED_DATASET_INPUTS: ${ML_AIR_REQUIRE_DECLARED_DATASET_INPUTS:-0}
      ML_AIR_STRICT_DATASET_VERSION_REQUIRED: ${ML_AIR_STRICT_DATASET_VERSION_REQUIRED:-1}
      ML_AIR_STRICT_DATASET_VERSION_ALL_POST_RUNS: ${ML_AIR_STRICT_DATASET_VERSION_ALL_POST_RUNS:-0}
      ML_AIR_EVENT_OUTBOX: ${ML_AIR_EVENT_OUTBOX:-0}
      ML_AIR_EVENT_OUTBOX_DRAIN_INTERVAL_SEC: ${ML_AIR_EVENT_OUTBOX_DRAIN_INTERVAL_SEC:-0}
      ML_AIR_SEMANTIC_WEBHOOK_DELIVERY: ${ML_AIR_SEMANTIC_WEBHOOK_DELIVERY:-0}
      ML_AIR_WEBHOOK_ALLOWED_HOSTS: ${ML_AIR_WEBHOOK_ALLOWED_HOSTS:-}
      ML_AIR_SEMANTIC_WEBHOOK_TIMEOUT_SECONDS: ${ML_AIR_SEMANTIC_WEBHOOK_TIMEOUT_SECONDS:-10}
      ML_AIR_SEMANTIC_WEBHOOK_MAX_ATTEMPTS: ${ML_AIR_SEMANTIC_WEBHOOK_MAX_ATTEMPTS:-3}
      ML_AIR_SEMANTIC_WEBHOOK_RETRY_BACKOFF_MS: ${ML_AIR_SEMANTIC_WEBHOOK_RETRY_BACKOFF_MS:-250}
      ML_AIR_SEMANTIC_WEBHOOK_DEDUPE: ${ML_AIR_SEMANTIC_WEBHOOK_DEDUPE:-0}
      ML_AIR_OTEL_ENABLED: ${ML_AIR_OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_API:-mlair-api}
      ML_AIR_JAEGER_UI_URL: ${ML_AIR_JAEGER_UI_URL:-}
    ports:
      - "${ML_AIR_API_PORT:-8080}:8080"
    volumes:
      - ml_air_dataset_artifacts:/mlair/artifacts/datasets
    depends_on:
      - redis
      - postgres
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  realtime:
    build:
      context: ..
      dockerfile: realtime/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${ML_AIR_PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: ml-air-realtime
    environment:
      ML_AIR_REDIS_URL: ${ML_AIR_REDIS_URL:-redis://redis:6379/0}
      ML_AIR_LOG_LEVEL: ${ML_AIR_LOG_LEVEL:-INFO}
      ML_AIR_REALTIME_METRICS_PORT: ${ML_AIR_REALTIME_METRICS_PORT:-9104}
      ML_AIR_JWT_HS256_SECRET: ${ML_AIR_JWT_HS256_SECRET:-mlair-dev-jwt-secret-32bytes-minimum-key}
      ML_AIR_AUTH_TOKENS_JSON: ${ML_AIR_AUTH_TOKENS_JSON:-}
      ML_AIR_JWT_ISSUER: ${ML_AIR_JWT_ISSUER:-}
      ML_AIR_JWT_AUDIENCE: ${ML_AIR_JWT_AUDIENCE:-}
      ML_AIR_JWT_JWKS_URL: ${ML_AIR_JWT_JWKS_URL:-}
      ML_AIR_OTEL_ENABLED: ${ML_AIR_OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_REALTIME:-mlair-realtime}
    ports:
      - "${MLAIR_REALTIME_PORT:-8001}:8001"
      - "${ML_AIR_REALTIME_METRICS_PORT:-9104}:9104"
    depends_on:
      - redis
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: scheduler/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${ML_AIR_PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: ml-air-scheduler
    environment:
      ML_AIR_REDIS_URL: ${ML_AIR_REDIS_URL:-redis://redis:6379/0}
      ML_AIR_DATABASE_URL: ${ML_AIR_DATABASE_URL:-postgresql://mlair:mlair@postgres:5432/mlair}
      ML_AIR_SCHEDULER_METRICS_PORT: ${ML_AIR_SCHEDULER_METRICS_PORT:-9102}
      ML_AIR_REPLAY_REQUIRE_ARTIFACT_EVIDENCE: ${ML_AIR_REPLAY_REQUIRE_ARTIFACT_EVIDENCE:-1}
      ML_AIR_REPLAY_REQUIRE_CHECKSUM: ${ML_AIR_REPLAY_REQUIRE_CHECKSUM:-0}
      ML_AIR_REPLAY_REQUIRE_SIGNED_MANIFEST: ${ML_AIR_REPLAY_REQUIRE_SIGNED_MANIFEST:-0}
      ML_AIR_MANIFEST_SIGNING_KEY: ${ML_AIR_MANIFEST_SIGNING_KEY:-mlair-dev-manifest-signing-key}
      ML_AIR_MANIFEST_ACTIVE_KEY_ID: ${ML_AIR_MANIFEST_ACTIVE_KEY_ID:-v1}
      ML_AIR_MANIFEST_SIGNING_KEYS_JSON: ${ML_AIR_MANIFEST_SIGNING_KEYS_JSON:-}
      ML_AIR_MANIFEST_KEY_PROVIDER: ${ML_AIR_MANIFEST_KEY_PROVIDER:-env}
      ML_AIR_MANIFEST_MANAGED_KEYS_FILE: ${ML_AIR_MANIFEST_MANAGED_KEYS_FILE:-}
      ML_AIR_MANIFEST_STRICT_KEY_LIFECYCLE: ${ML_AIR_MANIFEST_STRICT_KEY_LIFECYCLE:-0}
      ML_AIR_MANIFEST_ALLOWED_KEY_IDS: ${ML_AIR_MANIFEST_ALLOWED_KEY_IDS:-}
      ML_AIR_MANIFEST_SIGNING_ALGORITHM: ${ML_AIR_MANIFEST_SIGNING_ALGORITHM:-hmac-sha256}
      ML_AIR_MANIFEST_ED25519_PUBLIC_KEY: ${ML_AIR_MANIFEST_ED25519_PUBLIC_KEY:-}
      ML_AIR_MANIFEST_ED25519_PUBLIC_KEYS_JSON: ${ML_AIR_MANIFEST_ED25519_PUBLIC_KEYS_JSON:-}
      ML_AIR_TASK_EXECUTION_MODE: ${ML_AIR_TASK_EXECUTION_MODE:-internal}
      ML_AIR_LEASE_REAP_INTERVAL_SECONDS: ${ML_AIR_LEASE_REAP_INTERVAL_SECONDS:-5}
      MLAIR_REALTIME_ENABLED: ${MLAIR_REALTIME_ENABLED:-true}
      ML_AIR_OTEL_ENABLED: ${ML_AIR_OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_SCHEDULER:-mlair-scheduler}
    ports:
      - "${ML_AIR_SCHEDULER_METRICS_PORT:-9102}:9102"
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  executor:
    build:
      context: ..
      dockerfile: executor/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${ML_AIR_PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: ml-air-executor
    environment:
      ML_AIR_REDIS_URL: ${ML_AIR_REDIS_URL:-redis://redis:6379/0}
      ML_AIR_DATABASE_URL: ${ML_AIR_DATABASE_URL:-postgresql://mlair:mlair@postgres:5432/mlair}
      ML_AIR_EXECUTOR_METRICS_PORT: ${ML_AIR_EXECUTOR_METRICS_PORT:-9103}
      ML_AIR_API_BASE_URL: ${ML_AIR_API_BASE_URL:-http://api:8080}
      ML_AIR_TRACKING_TOKEN: ${ML_AIR_TRACKING_TOKEN:-admin-token}
      ML_AIR_MANIFEST_SIGNING_KEY: ${ML_AIR_MANIFEST_SIGNING_KEY:-mlair-dev-manifest-signing-key}
      ML_AIR_MANIFEST_ACTIVE_KEY_ID: ${ML_AIR_MANIFEST_ACTIVE_KEY_ID:-v1}
      ML_AIR_MANIFEST_SIGNING_KEYS_JSON: ${ML_AIR_MANIFEST_SIGNING_KEYS_JSON:-}
      ML_AIR_MANIFEST_KEY_PROVIDER: ${ML_AIR_MANIFEST_KEY_PROVIDER:-env}
      ML_AIR_MANIFEST_MANAGED_KEYS_FILE: ${ML_AIR_MANIFEST_MANAGED_KEYS_FILE:-}
      ML_AIR_MANIFEST_STRICT_KEY_LIFECYCLE: ${ML_AIR_MANIFEST_STRICT_KEY_LIFECYCLE:-0}
      ML_AIR_MANIFEST_ALLOWED_KEY_IDS: ${ML_AIR_MANIFEST_ALLOWED_KEY_IDS:-}
      ML_AIR_MANIFEST_SIGNING_ALGORITHM: ${ML_AIR_MANIFEST_SIGNING_ALGORITHM:-hmac-sha256}
      ML_AIR_MANIFEST_ED25519_PRIVATE_KEY: ${ML_AIR_MANIFEST_ED25519_PRIVATE_KEY:-}
      ML_AIR_MANIFEST_ED25519_PRIVATE_KEYS_JSON: ${ML_AIR_MANIFEST_ED25519_PRIVATE_KEYS_JSON:-}
      ML_AIR_OTEL_ENABLED: ${ML_AIR_OTEL_ENABLED:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_EXECUTOR:-mlair-executor}
    ports:
      - "${ML_AIR_EXECUTOR_METRICS_PORT:-9103}:9103"
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: ml-air-jaeger
    profiles:
      - traces
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${ML_AIR_JAEGER_UI_PORT:-16686}:16686"
      - "${ML_AIR_JAEGER_OTLP_GRPC_PORT:-4317}:4317"
    restart: unless-stopped

  # Grafana Tempo (OTLP gRPC). Use tempo:4317 on the Compose network; host OTLP maps to 4327
  # so Jaeger (host 4317) and Tempo can run together under --profile traces.
  tempo:
    image: grafana/tempo:2.7.2
    container_name: ml-air-tempo
    profiles:
      - traces
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - ml_air_tempo:/var/tempo
    ports:
      - "${ML_AIR_TEMPO_HTTP_PORT:-3200}:3200"
      - "${ML_AIR_TEMPO_OTLP_GRPC_PORT:-4327}:4317"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ml-air-redis
    ports:
      - "${ML_AIR_REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: ml-air-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlair}
      POSTGRES_DB: ${POSTGRES_DB:-mlair}
    ports:
      - "${ML_AIR_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ml_air_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ml-air-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
    ports:
      - "${ML_AIR_MINIO_API_PORT:-9000}:9000"
      - "${ML_AIR_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ml_air_minio:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ml-air-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
    ports:
      - "${ML_AIR_PROMETHEUS_PORT:-39090}:9090"
    depends_on:
      - api
      - scheduler
      - executor
      - realtime
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ml-air-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "${GF_USERS_ALLOW_SIGN_UP:-false}"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${ML_AIR_GRAFANA_PORT:-33000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  ml_air_pgdata:
  ml_air_minio:
  ml_air_dataset_artifacts:
  ml_air_tempo:
