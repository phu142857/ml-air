[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:postgresql]
priority=10
user=postgres
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
priority=20
command=redis-server --bind 127.0.0.1 --port 6379 --save ""
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
priority=30
directory=/app/api
user=appuser
environment=PYTHONPATH="/app/api:/app",ML_AIR_DATABASE_URL="%(ENV_ML_AIR_DATABASE_URL)s",ML_AIR_REDIS_URL="%(ENV_ML_AIR_REDIS_URL)s"
command=/bin/bash -c 'for i in $(seq 1 60); do pg_isready -h 127.0.0.1 -U mlair -d mlair && break; sleep 1; done; alembic upgrade head && exec uvicorn main:app --host 127.0.0.1 --port 18080'
autostart=true
autorestart=true
startsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
priority=40
directory=/app/scheduler
user=appuser
environment=PYTHONPATH="/app/scheduler:/app",ML_AIR_DATABASE_URL="%(ENV_ML_AIR_DATABASE_URL)s",ML_AIR_REDIS_URL="%(ENV_ML_AIR_REDIS_URL)s",ML_AIR_API_BASE_URL="http://127.0.0.1:18080"
command=python main.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:executor]
priority=40
directory=/app/executor
user=appuser
environment=PYTHONPATH="/app/executor:/app",ML_AIR_DATABASE_URL="%(ENV_ML_AIR_DATABASE_URL)s",ML_AIR_REDIS_URL="%(ENV_ML_AIR_REDIS_URL)s",ML_AIR_API_BASE_URL="http://127.0.0.1:18080"
command=python main.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:realtime]
priority=40
directory=/app/realtime
user=appuser
environment=PYTHONPATH="/app/realtime",ML_AIR_REDIS_URL="%(ENV_ML_AIR_REDIS_URL)s"
command=uvicorn app.main:app --host 127.0.0.1 --port 8001
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
priority=50
directory=/app/frontend
user=appuser
environment=HOSTNAME="127.0.0.1",PORT="3000",MLAIR_NEXT_INTERNAL_API_URL="http://127.0.0.1:18080"
command=node server.js
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
priority=60
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
