# Single public entrypoint for MLAir all-in-one (MLflow-style UX).
# Listens on :8080; API, Hub, and realtime stay on loopback-only upstreams.

upstream mlair_api {
    server 127.0.0.1:18080;
    keepalive 8;
}

upstream mlair_hub {
    server 127.0.0.1:3000;
    keepalive 8;
}

upstream mlair_realtime {
    server 127.0.0.1:8001;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 512m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /health {
        proxy_pass http://mlair_api;
    }

    location = /healthz {
        proxy_pass http://mlair_realtime;
    }

    location = /metrics {
        proxy_pass http://mlair_api;
    }

    location /v1/ {
        proxy_pass http://mlair_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /ws {
        proxy_pass http://mlair_realtime;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://mlair_hub;
    }
}
