# Example Alertmanager route tree for MLAir tenant-aware lifecycle alerts (Wave 1).
# Merge into your cluster Alertmanager config (or Prometheus Operator AlertmanagerConfig).
#
# Prerequisites:
#   - Prometheus loads deploy/monitoring/alerts/mlair-alerts.yml
#   - Rules group: mlair-lifecycle-semantic-tenant
#
# Apply checklist:
#   1. Copy `tenant-lifecycle` receiver → your Slack/PagerDuty/email
#   2. Reload Alertmanager (or wait for Operator sync)
#   3. amtool config routes test --config.file=alertmanager.yml
#   4. Fire test alert or wait for staging traffic

route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - alertname=~"MlAirLifecycle.*ByTenant"
      group_by: ["tenant_id", "alertname"]
      receiver: tenant-lifecycle
      continue: false

receivers:
  - name: default
    # webhook_configs:
    #   - url: https://hooks.example.com/default

  - name: tenant-lifecycle
    # slack_configs:
