{{- if and (not .Values.api.secret.existingSecretName) (not .Values.api.secret.externalSecret.enabled) (not .Values.api.secret.sealedSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: ml-air-api-secrets
type: Opaque
stringData:
  {{ .Values.api.secret.key }}: {{ .Values.api.secret.value | quote }}
  {{ .Values.api.secret.identityJwtKey }}: {{ .Values.api.secret.identityJwtValue | quote }}
  {{ .Values.api.secret.bootstrapAdminPasswordKey }}: {{ .Values.api.secret.bootstrapAdminPasswordValue | quote }}
  {{ .Values.api.secret.schedulerServiceAccountKey }}: {{ .Values.api.secret.schedulerServiceAccountValue | quote }}
  {{ .Values.api.secret.executorServiceAccountKey }}: {{ .Values.api.secret.executorServiceAccountValue | quote }}
{{- end }}
