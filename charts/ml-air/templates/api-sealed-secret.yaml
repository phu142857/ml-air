{{- if .Values.api.secret.sealedSecret.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ml-air-api-secrets
spec:
  encryptedData:
    {{ .Values.api.secret.key }}: {{ .Values.api.secret.sealedSecret.encryptedData | quote }}
    {{ .Values.api.secret.identityJwtKey }}: {{ .Values.api.secret.sealedSecret.identityJwtEncryptedData | quote }}
    {{ .Values.api.secret.bootstrapAdminPasswordKey }}: {{ .Values.api.secret.sealedSecret.bootstrapAdminPasswordEncryptedData | quote }}
    {{ .Values.api.secret.schedulerServiceAccountKey }}: {{ .Values.api.secret.sealedSecret.schedulerServiceAccountEncryptedData | quote }}
    {{ .Values.api.secret.executorServiceAccountKey }}: {{ .Values.api.secret.sealedSecret.executorServiceAccountEncryptedData | quote }}
  template:
    metadata:
      name: ml-air-api-secrets
    type: Opaque
{{- end }}
