frontend:
  image:
    repository: ghcr.io/your-org/ml-air-frontend
    tag: latest

api:
  image:
    repository: ghcr.io/your-org/ml-air-api
    tag: latest
  env:
    jwtIssuer: ""
    jwtAudience: ""
    jwtJwksUrl: ""
  extraEnv:
    MLAIR_PROFILE: staging
    ML_AIR_ENVIRONMENT: staging
    ML_AIR_NOTIFICATION_DELIVERY: "0"
    ML_AIR_INTEGRATION_DELIVERY: "0"
    ML_AIR_SIEM_EXPORT_ENABLED: "0"
    ML_AIR_CORS_ALLOWED_ORIGINS: "https://ml-air-staging.internal"
  # Strict lifecycle OS for staging: merge deploy/env/staging-strict.env.example
  # into API/scheduler env (Helm template extension TBD) — see docs/configuration.md
  secret:
    # Prefer existing/external secret in staging.
    existingSecretName: ml-air-api-secrets
    key: jwtHs256Secret
    value: "__from_secret__"
    externalSecret:
      enabled: false
      secretStoreRef:
        name: ""
        kind: ClusterSecretStore
      remoteRef:
        key: ""
        property: ""
    sealedSecret:
      enabled: false
      encryptedData: ""
      identityJwtEncryptedData: ""
      bootstrapAdminPasswordEncryptedData: ""
      schedulerServiceAccountEncryptedData: ""
      executorServiceAccountEncryptedData: ""

scheduler:
  image:
    repository: ghcr.io/your-org/ml-air-scheduler
    tag: latest

executor:
  image:
    repository: ghcr.io/your-org/ml-air-executor
    tag: latest

realtime:
  image:
    repository: ghcr.io/your-org/ml-air-realtime
    tag: latest

ingress:
  enabled: true
  className: nginx
  host: ml-air-staging.internal
