openapi: 3.1.0
info:
  title: MLAir API
  version: 0.1.0-draft
  description: |
    Draft API contract for MLAir v1.
    All resources are tenant/project scoped by design.

    **Model registry:** stages `staging` | `production` | `archived`, **per-version approval**
    (`pending_manual_approval` | `approved` | `rejected`), **promote** (production requires `approved`
    unless `ML_AIR_SKIP_APPROVAL_FOR_PROMOTE=1`), optional **serving slot** assignments
    (`candidate` | `challenger` | `champion` | `canary`), plus optional promote webhooks for downstream systems.

    **Note:** The **serving** HTTP paths below match the intended contract; in the default repo tree their
    FastAPI handlers may be **commented out** in `api/app/api/routes/v1.py` (DB table `model_serving_slots` and
    service code may still exist). Prefer the running OpenAPI doc from the server or `v1.py` when integrating.

    **Runs, readiness, datasets, lineage, pipeline versions, tracking, search, and plugins** sections
    in this file are kept aligned with `api/app/api/routes/v1.py` (draft; prefer the running service
    when a field is documented as free-form JSON).

servers:
  - url: https://api.ml-air.example.com

tags:
  - name: Auth
  - name: Pipelines
  - name: Runs
  - name: Tasks
  - name: Worker
  - name: Models
  - name: Datasets
  - name: Lineage
  - name: Tracking
  - name: Search
  - name: Plugins
  - name: Audit

paths:
  /v1/tenants:
    get:
      tags: [Pipelines]
      summary: List tenants (scope depends on caller token)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantList"

  /v1/tenants/{tenant_id}/projects:
    get:
      tags: [Pipelines]
      summary: List projects in tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"

  /v1/tenants/{tenant_id}/projects/registry:
    post:
      tags: [Pipelines]
      summary: Register project in tenant catalog (before operational activity)
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
                  minLength: 1
                name:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Catalog row created or updated
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, project_id, name]
                properties:
                  tenant_id:
                    type: string
                  project_id:
                    type: string
                  name:
                    type: string
        "400":
          description: Invalid body or reserved project_id

  /v1/tenants/{tenant_id}/projects/{project_id}/pipelines:
    get:
      tags: [Pipelines]
      summary: List pipelines
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
    post:
      tags: [Pipelines]
      summary: Create pipeline
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineCreate"
      responses:
        "201":
          description: Created

  /v1/tenants/{tenant_id}/projects/{project_id}/pipelines/{pipeline_id}/dag:
    get:
      tags: [Pipelines]
      summary: Get DAG graph
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonValue"

  /v1/tenants/{tenant_id}/projects/{project_id}/pipelines/{pipeline_id}/check-readiness:
    post:
      tags: [Runs]
      summary: Evaluate data readiness using latest pipeline run snapshot
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckReadinessRequest"
      responses:
        "200":
          description: Readiness result (includes ephemeral run_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckReadinessResponse"
        "404":
          description: pipeline_has_no_runs

  /v1/tenants/{tenant_id}/projects/{project_id}/pipelines/{pipeline_id}/run:
    post:
      tags: [Runs]
      summary: Create run with readiness gate (pipeline_id from path)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRunRequest"
      responses:
        "200":
          description: Run created or FAILED with blocked_by_gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatedRunResponse"

  /v1/tenants/{tenant_id}/projects/{project_id}/runs:
    post:
      tags: [Runs]
      summary: Create run for a pipeline (enqueue)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRunRequest"
      responses:
        "200":
          description: Run row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunRow"
    get:
      tags: [Runs]
      summary: List runs in project
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Run list page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}:
    get:
      tags: [Runs]
      summary: Get run detail
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunRow"
        "404":
          description: run_not_found

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}/readiness:
    get:
      tags: [Runs]
      summary: Dataset readiness rows for this run
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Aggregate readiness view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunReadinessResponse"

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}/status:
    post:
      tags: [Runs]
      summary: Update run status (external integration)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRunStatusRequest"
      responses:
        "200":
          description: Updated run row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunRow"

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}/dlq/replay:
    post:
      tags: [Runs]
      summary: Replay dead-letter tasks for a run
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Replay summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DlqReplayResponse"

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}/logs:
    get:
      tags: [Runs]
      summary: List run log entries
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        "200":
          description: Log page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunLogsPage"

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}/replay:
    post:
      tags: [Runs]
      summary: Partial replay from a task (fork run)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayRunRequest"
      responses:
        "200":
          description: New replay run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunRow"

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}/params:
    post:
      tags: [Tracking]
      summary: Log one param for a run
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogParamRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonValue"

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}/metrics:
    post:
      tags: [Tracking]
      summary: Log one metric (optional step)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogMetricRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonValue"

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}/artifacts:
    post:
      tags: [Tracking]
      summary: Log one artifact binding
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogArtifactRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonValue"

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}/tasks/{task_id}/manifest:
    post:
      tags: [Runs]
      summary: Upsert signed task manifest (replay / audit)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskManifestRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonValue"

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}/tracking:
    get:
      tags: [Tracking]
      summary: Aggregated params, metrics, artifacts for a run
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Tracking bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTrackingPayload"

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/compare:
    post:
      tags: [Tracking]
      summary: Compare metrics across runs
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareRunsRequest"
      responses:
        "200":
          description: Compare result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonValue"

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}/tasks:
    get:
      tags: [Tasks]
      summary: List tasks in run
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTasksResponse"

  /v1/tenants/{tenant_id}/projects/{project_id}/tasks/{task_id}:
    get:
      tags: [Tasks]
      summary: Get one task by ID
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRow"
        "404":
          description: task_not_found

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/trigger:
    post:
      tags: [Runs]
      summary: Trigger run from model + dataset (resolved pipeline)
      description: |
        Resolves `pipeline_id` from `model_pipeline_mapping` (or latest model-version run), injects
        `artifact_uri` / `base_weights_source` / `base_version_id` into `plugin_context` when available,
        then creates a run and applies the data-readiness gate.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRunByModelRequest"
      responses:
        "200":
          description: Run created (may be FAILED if blocked by readiness gate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerRunByModelResponse"
        "404":
          description: Model or dataset not found
        "422":
          description: Validation or BLOCKED (e.g. unresolved pipeline, missing plugins)

  /v1/auth/whoami:
    get:
      tags: [Auth]
      summary: Return principal from bearer token
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Caller identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"

  /v1/pipelines/validate:
    post:
      tags: [Pipelines]
      summary: Validate pipeline config plugin contract
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidatePipelineRequest"
      responses:
        "200":
          description: Contract OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [VALID]
        "403":
          description: forbidden

  /v1/tenants/{tenant_id}/projects/{project_id}/search:
    get:
      tags: [Search]
      summary: Full-text search runs, tasks, datasets
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - name: q
          in: query
          schema:
            type: string
            default: ""
        - name: type
          in: query
          description: Filter by item type
          schema:
            type: string
            enum: [all, run, task, dataset]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Search hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "429":
          description: search_rate_limited

  /v1/tenants/{tenant_id}/projects/{project_id}/experiments:
    post:
      tags: [Tracking]
      summary: Create experiment
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExperimentRequest"
      responses:
        "200":
          description: Created experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonValue"
    get:
      tags: [Tracking]
      summary: List experiments
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentList"

  /v1/tenants/{tenant_id}/projects/{project_id}/datasets:
    get:
      tags: [Datasets]
      summary: List datasets
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetList"

  /v1/tenants/{tenant_id}/projects/{project_id}/datasets/upload-preview:
    post:
      tags: [Datasets]
      summary: Preview CSV columns and row count (multipart)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Preview payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonValue"

  /v1/tenants/{tenant_id}/projects/{project_id}/datasets/upload:
    post:
      tags: [Datasets]
      summary: Upload CSV as new dataset version
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [dataset_name, file]
              properties:
                dataset_name:
                  type: string
                required_cols:
                  type: string
                  description: JSON array of column names (optional)
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Created dataset version summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonValue"
        "400":
          description: Validation error

  /v1/tenants/{tenant_id}/projects/{project_id}/datasets/{dataset_id}:
    get:
      tags: [Datasets]
      summary: Get dataset
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetRow"
        "404":
          description: dataset_not_found
    delete:
      tags: [Datasets]
      summary: Delete dataset and versions
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetDeleteResult"
        "404":
          description: dataset_not_found

  /v1/tenants/{tenant_id}/projects/{project_id}/datasets/{dataset_id}/readiness:
    get:
      tags: [Datasets]
      summary: Evaluate dataset-version readiness by policy (legacy-compatible)
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
        - name: policy_id
          in: query
          schema:
            type: string
          description: Preferred policy reference for readiness evaluation.
        - name: dataset_version_id
          in: query
          schema:
            type: string
          description: Optional immutable snapshot. If omitted, service resolves latest materialized version.
        - name: required_size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1000
          description: Legacy fallback used only when policy_id is omitted.
      responses:
        "200":
          description: Readiness summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetReadiness"
        "404":
          description: dataset_not_found
        "409":
          description: no_materialized_dataset_version (strict mode)

  /v1/tenants/{tenant_id}/projects/{project_id}/datasets/{dataset_id}/versions/{version_id}/readiness:
    get:
      tags: [Datasets]
      summary: Evaluate readiness for a specific immutable dataset version
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/DatasetVersionId"
        - name: policy_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Readiness summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetReadiness"
        "404":
          description: dataset_not_found or dataset_version_not_found
        "409":
          description: no_materialized_dataset_version (strict mode)

  /v1/tenants/{tenant_id}/projects/{project_id}/datasets/{dataset_id}/buffer:
    get:
      tags: [Datasets]
      summary: Get dataset accumulation buffer (materialization staging)
      description: |
        Returns `current_size`, `target_threshold`, and buffer metadata. If no row exists in
        `dataset_accumulation_buffers` yet, the API may return a compatibility shape with
        `target_threshold` defaulting to 1000 (see running service).
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetBuffer"
        "404":
          description: dataset_not_found
    patch:
      tags: [Datasets]
      summary: Set accumulation materialization config (target_threshold + strategy)
      description: |
        Maintainer role. Updates `dataset_accumulation_buffers.target_threshold`. Creates a buffer row
        if missing (seeds `current_size` from the dataset row). Ingestion preserves an existing
        threshold unless explicitly updated server-side.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetBufferPatchRequest"
      responses:
        "200":
          description: Updated buffer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetBuffer"
        "404":
          description: dataset_not_found
        "422":
          description: Validation error (e.g. invalid target_threshold)

