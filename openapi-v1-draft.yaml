openapi: 3.1.0
info:
  title: MLAir API
  version: 0.1.0-draft
  description: |
    Draft API contract for MLAir v1.
    All resources are tenant/project scoped by design.

servers:
  - url: https://api.ml-air.example.com

tags:
  - name: Pipelines
  - name: Runs
  - name: Tasks
  - name: Worker
  - name: Models
  - name: Serving
  - name: Audit

paths:
  /v1/tenants/{tenant_id}/projects:
    get:
      tags: [Pipelines]
      summary: List projects in tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"

  /v1/tenants/{tenant_id}/projects/{project_id}/pipelines:
    get:
      tags: [Pipelines]
      summary: List pipelines
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK
    post:
      tags: [Pipelines]
      summary: Create pipeline
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineCreate"
      responses:
        "201":
          description: Created

  /v1/tenants/{tenant_id}/projects/{project_id}/pipelines/{pipeline_id}/dag:
    get:
      tags: [Pipelines]
      summary: Get DAG graph
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: OK

  /v1/tenants/{tenant_id}/projects/{project_id}/pipelines/{pipeline_id}/runs:
    post:
      tags: [Runs]
      summary: Trigger run
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunTrigger"
      responses:
        "202":
          description: Accepted

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}:
    get:
      tags: [Runs]
      summary: Get run detail
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/{run_id}/tasks:
    get:
      tags: [Tasks]
      summary: List tasks in run
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK

  /v1/tenants/{tenant_id}/projects/{project_id}/runs/trigger:
    post:
      tags: [Runs]
      summary: Trigger run from model + dataset (resolved pipeline)
      description: |
        Resolves `pipeline_id` from `model_pipeline_mapping` (or latest model-version run), injects
        `artifact_uri` / `base_weights_source` / `base_version_id` into `plugin_context` when available,
        then creates a run and applies the data-readiness gate.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRunByModelRequest"
      responses:
        "200":
          description: Run created (may be FAILED if blocked by readiness gate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerRunByModelResponse"
        "404":
          description: Model or dataset not found
        "422":
          description: Validation or BLOCKED (e.g. unresolved pipeline, missing plugins)

  /v1/tenants/{tenant_id}/projects/{project_id}/models/{model_id}/pipeline-mapping:
    put:
      tags: [Models]
      summary: Set default pipeline for a model
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ModelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelPipelineMappingRequest"
      responses:
        "200":
          description: Mapping upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPipelineMappingRow"
        "404":
          description: Model not found
        "422":
          description: Pipeline not registered in project

  /v1/tenants/{tenant_id}/projects/{project_id}/models/{model_id}/resolved-pipeline:
    get:
      tags: [Models]
      summary: Resolve default pipeline and base weights for a model
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: Resolution payload (may be partially unresolved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedPipeline"

  /v1/tenants/{tenant_id}/projects/{project_id}/tasks/{task_id}/logs:
    get:
      tags: [Tasks]
      summary: Get task logs
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: OK

  /v1/tenants/{tenant_id}/projects/{project_id}/models:
    get:
      tags: [Models]
      summary: List model versions
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: OK

  /v1/tenants/{tenant_id}/projects/{project_id}/models/{model_version}/approval:
    get:
      tags: [Models]
      summary: Get model approval state
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ModelVersion"
      responses:
        "200":
          description: OK
    put:
      tags: [Models]
      summary: Update model approval state
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ModelVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelApprovalUpdate"
      responses:
        "200":
          description: Updated

  /v1/tenants/{tenant_id}/projects/{project_id}/models/{model_version}/promote:
    post:
      tags: [Serving]
      summary: Promote model version to slot
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ModelVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteRequest"
      responses:
        "200":
          description: Promoted

  /v1/tenants/{tenant_id}/projects/{project_id}/serving/route:
    get:
      tags: [Serving]
      summary: Resolve current route by slot
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - in: query
          name: use_case_key
          required: true
          schema:
            type: string
        - in: query
          name: slot
          required: false
          schema:
            type: string
            enum: [candidate, challenger, champion, canary]
            default: champion
      responses:
        "200":
          description: OK

  /v1/tasks/lease:
    post:
      tags: [Worker]
      summary: Lease queued tasks (external execution)
      description: |
        When `ML_AIR_TASK_EXECUTION_MODE=external`, returns tasks in `QUEUED` matching `capabilities` (task `plugin` names).
        Auth: `ML_AIR_WORKER_TOKEN` as Bearer (global lease), or maintainer+ token (tenant/project scoped).
        Use `encodeURIComponent` for `task_id` on follow-up paths if it contains `:`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerLeaseRequest"
      responses:
        "200":
          description: Leased tasks (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerLeaseResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /v1/tasks/{task_id}/heartbeat:
    post:
      tags: [Worker]
      summary: Extend task lease TTL
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
          description: Full task id, often `{run_uuid}:{dag_step_id}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatRequest"
      responses:
        "200":
          description: Heartbeat result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerHeartbeatResponse"
        "503":
          description: External execution disabled

  /v1/tasks/{task_id}/complete:
    post:
      tags: [Worker]
      summary: Mark leased task successful
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCompleteRequest"
      responses:
        "200":
          description: Accepted; scheduler notified via task queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerCompleteResponse"
        "404":
          description: Task not found
        "409":
          description: Not leased by this worker or conflict
        "503":
          description: External execution disabled

  /v1/tasks/{task_id}/fail:
    post:
      tags: [Worker]
      summary: Mark leased task failed
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerFailRequest"
      responses:
        "200":
          description: Recorded; scheduler may retry per policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOkResponse"
        "404":
          description: Task not found
        "409":
          description: Not leased by this worker
        "503":
          description: External execution disabled

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Static API token, JWT, or `ML_AIR_WORKER_TOKEN` value when configured.

  parameters:
    TenantId:
      in: path
      name: tenant_id
      required: true
      schema:
        type: string
    ProjectId:
      in: path
      name: project_id
      required: true
      schema:
        type: string
    PipelineId:
      in: path
      name: pipeline_id
      required: true
      schema:
        type: string
    RunId:
      in: path
      name: run_id
      required: true
      schema:
        type: string
    TaskId:
      in: path
      name: task_id
      required: true
      schema:
        type: string
    ModelVersion:
      in: path
      name: model_version
      required: true
      schema:
        type: string
    ModelId:
      in: path
      name: model_id
      required: true
      schema:
        type: string

  schemas:
    Project:
      type: object
      properties:
        project_id:
          type: string
        name:
          type: string
    PipelineCreate:
      type: object
      required: [name, dag]
      properties:
        name:
          type: string
        dag:
          type: object
    RunTrigger:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string

    TriggerRunByModelRequest:
      type: object
      required: [model_id, dataset_id]
      properties:
        model_id:
          type: string
          minLength: 1
        dataset_id:
          type: string
          minLength: 1
        dataset_version_id:
          type: string
          nullable: true
          description: When omitted, uses latest version for the dataset.
        pipeline_id_override:
          type: string
          nullable: true
          description: Advanced; force pipeline while still using model registry for base weights.
        experiment_id:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
          nullable: true
        priority:
          type: string
          enum: [high, normal, low]
          default: normal
        max_parallel_tasks:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        training_mode:
          type: string
          description: Affects default readiness thresholds when override inputs are not set.
          default: full
        override_config:
          type: object
          additionalProperties: true

    TriggerRunByModelResponse:
      type: object
      description: Run row plus trigger metadata (same shape as API JSON).
      additionalProperties: true
      properties:
        run_id:
          type: string
        status:
          type: string
        blocked_by_gate:
          type: boolean
        resolved_pipeline_id:
          type: string
          nullable: true
        resolution:
          type: object
          nullable: true
          properties:
            pipeline_source:
              type: string
              nullable: true
            base_weights_source:
              type: string
              nullable: true
        readiness:
          type: object
          additionalProperties: true

    ModelPipelineMappingRequest:
      type: object
      required: [pipeline_id]
      properties:
        pipeline_id:
          type: string
          minLength: 1

    ModelPipelineMappingRow:
      type: object
      properties:
        tenant_id:
          type: string
        project_id:
          type: string
        model_id:
          type: string
        pipeline_id:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

    ResolvedPipeline:
      type: object
      properties:
        model_id:
          type: string
        pipeline_id:
          type: string
          nullable: true
        model_version:
          type: integer
          nullable: true
        run_id:
          type: string
          nullable: true
        source:
          type: string
          description: e.g. model_pipeline_mapping, latest_model_version_run, unresolved
        artifact_uri:
          type: string
          nullable: true
        base_weights_source:
          type: string
          nullable: true
          description: e.g. production_artifact, latest_artifact
        base_version_id:
          type: string
          nullable: true
    ModelApprovalUpdate:
      type: object
      required: [approval_status]
      properties:
        approval_status:
          type: string
          enum: [pending_manual_approval, approved, rejected]
        reason:
          type: string
    PromoteRequest:
      type: object
      required: [use_case_key, slot]
      properties:
        use_case_key:
          type: string
        slot:
          type: string
          enum: [candidate, challenger, champion, canary]
        metadata:
          type: object
          additionalProperties: true

    WorkerLeaseRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 256
        capabilities:
          type: array
          items:
            type: string
          description: Plugin names to accept (e.g. app_etl_adapter). Empty = any plugin.
        max_tasks:
          type: integer
          minimum: 1
          maximum: 50
          default: 1

    WorkerLeasedTaskPayload:
      type: object
      description: Snapshot for the worker (context, config, ids).
      additionalProperties: true

    WorkerLeasedTask:
      type: object
      properties:
        task_id:
          type: string
        run_id:
          type: string
        plugin:
          type: string
        attempt:
          type: integer
        tenant_id:
          type: string
        project_id:
          type: string
        pipeline_id:
          type: string
        priority:
          type: string
        task_key:
          type: string
        payload:
          $ref: "#/components/schemas/WorkerLeasedTaskPayload"

    WorkerLeaseResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/WorkerLeasedTask"
        execution_mode:
          type: string
          enum: [internal, external]

    WorkerHeartbeatRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 256

    WorkerHeartbeatResponse:
      type: object
      properties:
        ok:
          type: boolean

    WorkerCompleteRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 256
        metrics:
          type: object
          additionalProperties: true
        artifact_uri:
          type: string
          nullable: true

    WorkerCompleteResponse:
      type: object
      properties:
        ok:
          type: boolean
        task_id:
          type: string
        status:
          type: string
        idempotent:
          type: boolean
          description: Present when task was already SUCCESS.

    WorkerFailRequest:
      type: object
      required: [worker_id, error]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 256
        error:
          type: string
          minLength: 1
          maxLength: 8000

    WorkerOkResponse:
      type: object
      properties:
        ok:
          type: boolean
        task_id:
          type: string
        status:
          type: string
