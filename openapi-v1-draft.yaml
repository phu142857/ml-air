      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/ServingSlot"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetServingSlotRequest"
      responses:
        "200":
          description: Updated slot matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelServingMatrix"
        "404":
          description: model_not_found or model_version_not_found
        "422":
          description: invalid_serving_slot

  /v1/tasks/lease:
    post:
      tags: [Worker]
      summary: Lease queued tasks (external execution)
      description: |
        When `ML_AIR_TASK_EXECUTION_MODE=external`, returns tasks in `QUEUED` matching `capabilities` (task `plugin` names).
        Auth: `ML_AIR_WORKER_TOKEN` as Bearer (global lease), or maintainer+ token (tenant/project scoped).
        Use `encodeURIComponent` for `task_id` on follow-up paths if it contains `:`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerLeaseRequest"
      responses:
        "200":
          description: Leased tasks (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerLeaseResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /v1/tasks/{task_id}/heartbeat:
    post:
      tags: [Worker]
      summary: Extend task lease TTL
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
          description: Full task id, often `{run_uuid}:{dag_step_id}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatRequest"
      responses:
        "200":
          description: Heartbeat result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerHeartbeatResponse"
        "503":
          description: External execution disabled

  /v1/tasks/{task_id}/complete:
    post:
      tags: [Worker]
      summary: Mark leased task successful
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerCompleteRequest"
      responses:
        "200":
          description: Accepted; scheduler notified via task queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerCompleteResponse"
        "404":
          description: Task not found
        "409":
          description: Not leased by this worker or conflict
        "503":
          description: External execution disabled

  /v1/tasks/{task_id}/fail:
    post:
      tags: [Worker]
      summary: Mark leased task failed
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerFailRequest"
      responses:
        "200":
          description: Recorded; scheduler may retry per policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerOkResponse"
        "404":
          description: Task not found
        "409":
          description: Not leased by this worker
        "503":
          description: External execution disabled

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Static API token, JWT, or `ML_AIR_WORKER_TOKEN` value when configured.

  parameters:
    TenantId:
      in: path
      name: tenant_id
      required: true
      schema:
        type: string
    ProjectId:
      in: path
      name: project_id
      required: true
      schema:
        type: string
    PipelineId:
      in: path
      name: pipeline_id
      required: true
      schema:
        type: string
    RunId:
      in: path
      name: run_id
      required: true
      schema:
        type: string
    TaskId:
      in: path
      name: task_id
      required: true
      schema:
        type: string
    ModelId:
      in: path
      name: model_id
      required: true
      schema:
        type: string
    ModelVersionNumber:
      in: path
      name: version
      required: true
      schema:
        type: integer
        minimum: 1
      description: Integer model version (monotonic per model)

    DatasetId:
      in: path
      name: dataset_id
      required: true
      schema:
        type: string

    DatasetVersionId:
      in: path
      name: version_id
      required: true
      schema:
        type: string
      description: Dataset version UUID (also path param under /dataset-versions/)

    PipelineVersionRecordId:
      in: path
      name: version_id
      required: true
      schema:
        type: string
      description: Pipeline version UUID

    PluginName:
      in: path
      name: plugin_name
      required: true
      schema:
        type: string

    ServingSlot:
      in: path
      name: slot
      required: true
      schema:
        type: string
        enum: [candidate, challenger, champion, canary]

  schemas:
    Project:
      type: object
      properties:
        project_id:
          type: string
        name:
          type: string
    PipelineCreate:
      type: object
      required: [name, dag]
      properties:
        name:
          type: string
        dag:
          type: object

    TriggerRunByModelRequest:
      type: object
      required: [model_id, dataset_id]
      properties:
        model_id:
          type: string
          minLength: 1
        dataset_id:
          type: string
          minLength: 1
        dataset_version_id:
          type: string
          nullable: true
          description: When omitted, uses latest version for the dataset.
        pipeline_id_override:
          type: string
          nullable: true
          description: Advanced; force pipeline while still using model registry for base weights.
        experiment_id:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
          nullable: true
        priority:
          type: string
          enum: [high, normal, low]
          default: normal
        max_parallel_tasks:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        training_mode:
          type: string
          description: Affects default readiness thresholds when override inputs are not set.
          default: full
        override_config:
          type: object
          additionalProperties: true

    TriggerRunByModelResponse:
      type: object
      description: Run row plus trigger metadata (same shape as API JSON).
      additionalProperties: true
      properties:
        run_id:
          type: string
        status:
          type: string
        blocked_by_gate:
          type: boolean
        resolved_pipeline_id:
          type: string
          nullable: true
        resolution:
          type: object
          nullable: true
          properties:
            pipeline_source:
              type: string
              nullable: true
            base_weights_source:
              type: string
              nullable: true
        readiness:
          type: object
          additionalProperties: true

    ModelPipelineMappingRequest:
      type: object
      required: [pipeline_id]
      properties:
        pipeline_id:
          type: string
          minLength: 1

    ModelPipelineMappingRow:
      type: object
      properties:
        tenant_id:
          type: string
        project_id:
          type: string
        model_id:
          type: string
        pipeline_id:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

    ResolvedPipeline:
      type: object
      properties:
        model_id:
          type: string
        pipeline_id:
          type: string
          nullable: true
        model_version:
          type: integer
          nullable: true
        run_id:
          type: string
          nullable: true
        source:
          type: string
          description: e.g. model_pipeline_mapping, latest_model_version_run, unresolved
        artifact_uri:
          type: string
          nullable: true
        base_weights_source:
          type: string
          nullable: true
          description: e.g. production_artifact, latest_artifact
        base_version_id:
          type: string
          nullable: true
    CreateModelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true

    ModelRow:
      type: object
      description: Registry row for a logical model
      properties:
        model_id:
          type: string
        tenant_id:
          type: string
        project_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string

    ModelList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelRow"

    ModelDeleteResult:
      type: object
      properties:
        model_id:
          type: string
        deleted:
          type: boolean

    ModelVersionRow:
      type: object
      properties:
        version_id:
          type: string
        model_id:
          type: string
        version:
          type: integer
        run_id:
          type: string
          nullable: true
        artifact_uri:
          type: string
          nullable: true
        stage:
          type: string
          description: Typically staging, production, or archived
        created_at:
          type: string
        approval_status:
          type: string
          enum: [pending_manual_approval, approved, rejected]
        approval_reason:
          type: string
          nullable: true
        approval_updated_at:
          type: string
          nullable: true

    ModelApprovalState:
      type: object
      properties:
        model_id:
          type: string
        version:
          type: integer
        version_id:
          type: string
        approval_status:
          type: string
          enum: [pending_manual_approval, approved, rejected]
        approval_reason:
          type: string
          nullable: true
        approval_updated_at:
          type: string
          nullable: true

    ModelApprovalUpdate:
      type: object
      required: [approval_status]
      properties:
        approval_status:
          type: string
          enum: [pending_manual_approval, approved, rejected]
        reason:
          type: string
          nullable: true

    SetServingSlotRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1

    ModelServingMatrix:
      type: object
      properties:
        model_id:
          type: string
        slots:
          type: object
          additionalProperties:
            type: object
            properties:
              slot:
                type: string
              version_id:
                type: string
              version:
                type: integer
              artifact_uri:
                type: string
                nullable: true
              stage:
                type: string
              approval_status:
                type: string

    ModelVersionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelVersionRow"

    ModelVersionDeleteResult:
      type: object
      properties:
        model_id:
          type: string
        version:
          type: integer
        deleted:
          type: boolean

    CreateModelVersionRequest:
      type: object
      properties:
        run_id:
          type: string
          nullable: true
        artifact_uri:
          type: string
          nullable: true
          description: When omitted, server assigns default URI for next version
        stage:
          type: string
          default: staging
          description: Recommended values staging | production | archived

    NextArtifactUriPreview:
      type: object
      properties:
        model_id:
          type: string
        next_version:
          type: integer
        artifact_uri:
          type: string

    ModelStatus:
      type: object
      description: |
        Latest-version linkage and dataset readiness for the model's training run.
        Exact keys depend on linkage (see API implementation).
      additionalProperties: true

    TriggerPolicy:
      type: object
      properties:
        tenant_id:
          type: string
        project_id:
          type: string
        model_id:
          type: string
        trigger_mode:
          type: string
          enum: [manual, auto_ready, schedule]
        debounce_minutes:
          type: integer
        schedule_cron:
          type: string
        source:
          type: string
          description: default when no row stored, or stored
        created_at:
          type: string
        updated_at:
          type: string

    TriggerPolicyUpsert:
      type: object
      properties:
        trigger_mode:
          type: string
          enum: [manual, auto_ready, schedule]
          default: manual
        debounce_minutes:
          type: integer
          default: 10
          minimum: 1
        schedule_cron:
          type: string
          nullable: true
          description: Cron expression when mode is schedule

    PromoteRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: Numeric model version to promote
        stage:
          type: string
          description: Target lifecycle stage (MLflow-style)
          enum: [staging, production, archived]
          default: production

    JsonValue:
      type: object
      description: Free-form JSON object from API (shape varies by endpoint).
      additionalProperties: true

    TenantList:
      type: object
      properties:
        limit:
          type: integer
        items:
          type: array
          items:
            type: object
            properties:
              tenant_id:
                type: string
              name:
                type: string

    Whoami:
      type: object
      properties:
        role:
          type: string
        tenant_id:
          type: string
          nullable: true
        project_ids:
          type: array
          items:
            type: string

    TriggerRunRequest:
      type: object
      required: [pipeline_id]
      properties:
        pipeline_id:
          type: string
          minLength: 1
        experiment_id:
          type: string
          nullable: true
        plugin_name:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
          nullable: true
        priority:
          type: string
          default: normal
        max_parallel_tasks:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
        pipeline_version_id:
          type: string
          nullable: true
        use_latest_pipeline_version:
          type: boolean
          default: false
        training_mode:
          type: string
          default: full
        override_config:
          type: object
          additionalProperties: true

    CheckReadinessRequest:
      type: object
      properties:
        training_mode:
          type: string
          default: full
        override_config:
          type: object
          additionalProperties: true

    CheckReadinessResponse:
      type: object
      additionalProperties: true

    GatedRunResponse:
      type: object
      additionalProperties: true
      description: Run row plus optional blocked_by_gate and readiness

    RunRow:
      type: object
      additionalProperties: true
      description: Persisted run (see GET run in service)

    RunList:
      type: object
      properties:
        tenant_id:
          type: string
        project_id:
          type: string
        limit:
          type: integer
        offset:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunRow"

    RunReadinessResponse:
      type: object
      additionalProperties: true

    UpdateRunStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          minLength: 1
        reason:
          type: string
          nullable: true

    DlqReplayResponse:
      type: object
      properties:
        run_id:
          type: string
        replayed:
          type: integer
          description: Number of DLQ messages replayed

    RunLogsPage:
      type: object
      properties:
        run_id:
          type: string
        offset:
          type: integer
        limit:
          type: integer
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    ReplayRunRequest:
      type: object
      required: [from_task_id]
      properties:
        from_task_id:
          type: string
          minLength: 1
        idempotency_key:
          type: string
          nullable: true
        plugin_name:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true

    LogParamRequest:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          minLength: 1
        value:
          type: string

    LogMetricRequest:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          minLength: 1
        value:
          type: number
        step:
          type: integer
          default: 0

    LogArtifactRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
        uri:
          type: string
          nullable: true

    ManifestArtifact:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
        uri:
          type: string
          nullable: true

    ManifestPayload:
      type: object
      required: [run_id, task_id, status, pipeline_id, attempt, finished_at]
      properties:
        run_id:
          type: string
          minLength: 1
        task_id:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
        pipeline_id:
          type: string
          minLength: 1
        attempt:
          type: integer
          minimum: 1
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ManifestArtifact"
        lineage:
          type: object
          additionalProperties: true
        finished_at:
          type: string
          minLength: 1

    TaskManifestRequest:
      type: object
      required: [signature, payload]
      properties:
        algorithm:
          type: string
          minLength: 1
          default: hmac-sha256
        key_id:
          type: string
          minLength: 1
          default: v1
        signature:
          type: string
          minLength: 1
        payload:
          $ref: "#/components/schemas/ManifestPayload"

    RunTrackingPayload:
      type: object
      additionalProperties: true

    CompareRunsRequest:
      type: object
      properties:
        run_ids:
          type: array
          items:
            type: string

    RunTasksResponse:
      type: object
      properties:
        run_id:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    TaskRow:
      type: object
      additionalProperties: true

    ValidatePipelineRequest:
      type: object
      required: [config]
      properties:
        config:
          type: object
          additionalProperties: true

    SearchResponse:
      type: object
      additionalProperties: true

    CreateExperimentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true

    ExperimentList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    DatasetList:
      type: object
      properties:
        items:
          type: array
