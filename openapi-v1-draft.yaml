        plugin:
          type: string
        valid:
          type: boolean

    PluginToggleRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          default: true

    PluginToggleResponse:
      type: object
      properties:
        plugin:
          type: string
        enabled:
          type: boolean

    WorkerLeaseRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 256
        capabilities:
          type: array
          items:
            type: string
          description: Plugin names to accept (e.g. app_etl_adapter). Empty = any plugin.
        max_tasks:
          type: integer
          minimum: 1
          maximum: 50
