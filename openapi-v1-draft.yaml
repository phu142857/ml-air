        tenant_id:
          type: string
        project_id:
          type: string
        pipeline_id:
          type: string
        priority:
          type: string
        task_key:
          type: string
        payload:
          $ref: "#/components/schemas/WorkerLeasedTaskPayload"

    WorkerLeaseResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/WorkerLeasedTask"
        execution_mode:
          type: string
          enum: [internal, external]

    WorkerHeartbeatRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 256

    WorkerHeartbeatResponse:
      type: object
      properties:
        ok:
          type: boolean

    WorkerCompleteRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 256
        metrics:
          type: object
          additionalProperties: true
        artifact_uri:
          type: string
          nullable: true

    WorkerCompleteResponse:
      type: object
      properties:
        ok:
          type: boolean
        task_id:
          type: string
        status:
          type: string
        idempotent:
          type: boolean
          description: Present when task was already SUCCESS.

    WorkerFailRequest:
      type: object
      required: [worker_id, error]
      properties:
        worker_id:
          type: string
          minLength: 1
          maxLength: 256
        error:
          type: string
          minLength: 1
          maxLength: 8000

    WorkerOkResponse:
      type: object
      properties:
        ok:
          type: boolean
        task_id:
          type: string
        status:
          type: string
