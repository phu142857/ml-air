                  type: string
                  format: binary
                  description: Primary model artifact (e.g. weights archive)
                metadata_file:
                  type: string
                  format: binary
                  description: Optional sidecar metadata
                run_id:
                  type: string
                  nullable: true
                stage:
                  type: string
                  default: staging
                  description: Target lifecycle stage (typically staging)
      responses:
        "200":
          description: Created version row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelVersionRow"
