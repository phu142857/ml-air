    CreatePipelineVersionRequest:
      type: object
      properties:
        config:
          type: object
          additionalProperties: true

    PipelineVersionList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    PipelineVersionDiff:
      type: object
      properties:
        version_id_a:
          type: string
        version_id_b:
