        changed_keys:
          type: array
          items:
            type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true

    PluginRegistryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        errors:
