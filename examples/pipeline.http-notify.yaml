# Pipeline with an HTTP notify task (requires ML_AIR_HTTP_TASK_ALLOWED_HOSTS or ML_AIR_WEBHOOK_ALLOWED_HOSTS)
pipeline_id: http_notify_demo
priority: normal
max_parallel_tasks: 2
plugin_name: echo_tracking
use_latest_pipeline_version: true
context:
  params:
    source: http_notify_demo
