name: deploy-helm-staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc123 or v1.0.0)"
        required: false
        default: "latest"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NAMESPACE: ml-air-staging
      RELEASE_NAME: ml-air
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.2

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_DATA}" | base64 -d > ~/.kube/config
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Validate required secrets
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          JWT_SECRET: ${{ secrets.ML_AIR_JWT_HS256_SECRET }}
          IDENTITY_JWT_SECRET: ${{ secrets.ML_AIR_IDENTITY_JWT_SECRET }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.ML_AIR_BOOTSTRAP_ADMIN_PASSWORD }}
          SCHEDULER_SECRET: ${{ secrets.ML_AIR_SA_SCHEDULER_SECRET }}
          EXECUTOR_SECRET: ${{ secrets.ML_AIR_SA_EXECUTOR_SECRET }}
        run: |
          if [ -z "${KUBE_CONFIG_DATA}" ]; then
            echo "Missing secret: KUBE_CONFIG_DATA"
            exit 1
          fi
          if [ -z "${JWT_SECRET}" ]; then
            echo "Missing secret: ML_AIR_JWT_HS256_SECRET"
            exit 1
          fi
          if [ -z "${IDENTITY_JWT_SECRET}" ]; then
            echo "Missing secret: ML_AIR_IDENTITY_JWT_SECRET"
            exit 1
          fi
          if [ -z "${BOOTSTRAP_ADMIN_PASSWORD}" ]; then
            echo "Missing secret: ML_AIR_BOOTSTRAP_ADMIN_PASSWORD"
            exit 1
          fi
          if [ -z "${SCHEDULER_SECRET}" ]; then
            echo "Missing secret: ML_AIR_SA_SCHEDULER_SECRET"
            exit 1
          fi
          if [ -z "${EXECUTOR_SECRET}" ]; then
            echo "Missing secret: ML_AIR_SA_EXECUTOR_SECRET"
            exit 1
          fi

      - name: Reconcile application secret
        env:
          JWT_SECRET: ${{ secrets.ML_AIR_JWT_HS256_SECRET }}
          IDENTITY_JWT_SECRET: ${{ secrets.ML_AIR_IDENTITY_JWT_SECRET }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.ML_AIR_BOOTSTRAP_ADMIN_PASSWORD }}
          SCHEDULER_SECRET: ${{ secrets.ML_AIR_SA_SCHEDULER_SECRET }}
          EXECUTOR_SECRET: ${{ secrets.ML_AIR_SA_EXECUTOR_SECRET }}
        run: |
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic ml-air-api-secrets \
            --namespace "${NAMESPACE}" \
            --from-literal=jwtHs256Secret="${JWT_SECRET}" \
            --from-literal=identityJwtSecret="${IDENTITY_JWT_SECRET}" \
            --from-literal=bootstrapAdminPassword="${BOOTSTRAP_ADMIN_PASSWORD}" \
            --from-literal=schedulerServiceAccountSecret="${SCHEDULER_SECRET}" \
            --from-literal=executorServiceAccountSecret="${EXECUTOR_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Helm upgrade --install
        run: |
          helm upgrade --install "${RELEASE_NAME}" charts/ml-air \
            --namespace "${NAMESPACE}" \
            --values charts/ml-air/values-staging.yaml \
            --set frontend.image.repository=ghcr.io/${{ github.repository_owner }}/ml-air-frontend \
            --set api.image.repository=ghcr.io/${{ github.repository_owner }}/ml-air-api \
            --set scheduler.image.repository=ghcr.io/${{ github.repository_owner }}/ml-air-scheduler \
            --set executor.image.repository=ghcr.io/${{ github.repository_owner }}/ml-air-executor \
            --set frontend.image.tag=${{ steps.tag.outputs.value }} \
            --set api.image.tag=${{ steps.tag.outputs.value }} \
            --set scheduler.image.tag=${{ steps.tag.outputs.value }} \
            --set executor.image.tag=${{ steps.tag.outputs.value }} \
            --wait --timeout 10m

      - name: Rollback on failure
        if: failure()
        run: |
          helm rollback "${RELEASE_NAME}" --namespace "${NAMESPACE}" || true
