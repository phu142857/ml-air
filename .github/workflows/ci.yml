name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quickstart-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare env
        run: |
          python -c "from pathlib import Path; p=[Path('.env.example'), Path('deploy/.env.infra.example')]; Path('.env').write_text('\n\n'.join(x.read_text(encoding='utf-8').rstrip() for x in p if x.is_file())+'\n', encoding='utf-8')"

      - name: Install mlair CLI
        run: pip install -e .

      - name: Preflight doctor
        run: mlair doctor

      - name: Boot quickstart stack
        run: mlair rebuild

      - name: Verify quickstart health
        run: mlair health

      - name: Identity signoff (static checks)
        run: python scripts/verify_identity_signoff.py

      - name: Identity E2E API
        run: python scripts/verify_identity_e2e.py

      - name: Wave 0 execution realtime
        run: |
          ML_AIR_BASE_URL=http://localhost:8080 \
          ML_AIR_TENANT_ID=default \
          ML_AIR_PROJECT_ID=default_project \
          python scripts/verify_execution_realtime.py

      - name: Strict lifecycle env examples (static)
        run: python scripts/verify_operator_signoff.py --skip-identity --skip-wave0

      - name: Execution signoff (static + unit)
        run: python scripts/verify_execution_signoff.py

      - name: Identity unit tests (container)
        run: |
          docker exec mlair sh -c 'cd /app/api && PYTHONPATH=/app/api:/app python -m unittest tests.test_identity_unit tests.test_identity_integration tests.test_worker_settings_unit tests.test_platform_policy_unit -q'

      - name: Seed demo data
        run: make seed-demo

      - name: Quickstart smoke
        run: make smoke-quickstart

      - name: Teardown stack
        if: always()
        run: mlair stop

  env-sync-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate env sync (.env.example vs compose refs)
        run: python scripts/check_env_sync.py

      - name: Deployment signoff (static guards)
        run: python scripts/verify_deployment_signoff.py

  manifest-key-rotation-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate manifest key rotation policy file
        run: python scripts/check_manifest_key_rotation.py --file deploy/security/manifest-keys.sample.json --algorithm hmac-sha256

  deploy-config-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deploy config safety
        run: python scripts/check_deploy_config.py

  api-python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install API requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Syntax check
        run: |
          python -m compileall api/app scheduler executor

  helm-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Lint chart
        run: helm lint charts/ml-air

      - name: Render chart
        run: helm template ml-air charts/ml-air >/tmp/ml-air-chart.out

  docker-build-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: api/Dockerfile
          - name: scheduler
            context: .
            dockerfile: scheduler/Dockerfile
          - name: executor
            context: .
            dockerfile: executor/Dockerfile
          - name: frontend
            context: .
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ml-air/${{ matrix.name }}:ci
