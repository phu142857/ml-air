name: release-image

# Publish the all-in-one MLAir image to GitHub Container Registry (GHCR).
# Users can then `docker pull ghcr.io/<owner>/ml-air:<tag>` instead of building
# locally. Building from a clone (`mlair build`) keeps working unchanged.
on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  workflow_dispatch:

env:
  # ghcr.io/<owner>/<repo> — resolved from the current repository, no hardcoding.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # main -> :edge, semver tag vX.Y.Z -> :X.Y.Z + :X.Y + :latest
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all-in-one image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.allinone
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
